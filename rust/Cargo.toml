[workspace]
resolver = "3"
members = [
    "neuro-cli",
    "neurocore-daemon",
    "neuro-bench",
]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/HemalTharakaeEranga/neurocore-os"
homepage = "https://neurocore-os.org/"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
