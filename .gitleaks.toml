# Gitleaks secret-detection policy for NeuroCore OS

title = "NeuroCore OS Secret & Credential Scanner"

[extend]
useDefault = true

[allowlist]
description = "Allow public GPG maintainer fingerprints and dataset checksums"
paths = [
    '''^kernel/fetch-kernel\.sh$''',
    '''^ml-stack/fetch-datasets\.sh$''',
    '''^tests/verify-security-hardening\.py$''',
]
