set default=0
set timeout=5
set gfxmode=auto
set gfxpayload=keep

insmod all_video
insmod gfxterm
insmod png
terminal_output gfxterm

if [ -f /boot/grub/themes/neurocore/theme.txt ]; then
    set theme=/boot/grub/themes/neurocore/theme.txt
fi

menuentry "NeuroCore OS 0.1.0-alpha (Spark) — Live Workstation (Hardened)" {
    linux /live/vmlinuz boot=live components quiet splash lsm=landlock,lockdown,yama,apparmor,bpf lockdown=integrity init_on_alloc=1 init_on_free=1 slab_nomerge page_alloc.shuffle=1 console=tty0 console=ttyS0,115200
    initrd /live/initrd.img
}

menuentry "NeuroCore OS 0.1.0-alpha (Spark) — Verbose Serial Debug" {
    linux /live/vmlinuz boot=live components console=tty0 console=ttyS0,115200 loglevel=7
    initrd /live/initrd.img
}

menuentry "NeuroCore OS 0.1.0-alpha (Spark) — Safe CPU/VM Fallback (nomodeset)" {
    linux /live/vmlinuz boot=live components nomodeset quiet splash console=tty0 console=ttyS0,115200
    initrd /live/initrd.img
}
