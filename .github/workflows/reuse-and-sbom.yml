name: REUSE 3.3, Static Lint & SBOM Policy

on:
  push:
    branches: [main, "v0.1.0-*"]
  pull_request:

permissions: {}

jobs:
  compliance-and-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Populate canonical SPDX license texts if needed
        run: |
          if [ ! -f LICENSES/GPL-2.0-only.txt ]; then
            ./scripts/fetch-spdx-licenses.sh
          fi

      - name: FSFE REUSE 3.3 Compliance Check
        uses: fsfe/reuse-action@bb774aa972c2a89ff34781233d275075cbddf542 # v5

      - name: Validate Shell Scripts with ShellCheck
        run: |
          shellcheck -S warning \
            scripts/*.sh \
            kernel/*.sh \
            mojo/scripts/*.sh \
            ml-stack/*.sh \
            branding/build-branding.sh \
            branding/motd/10-neurocore \
            mkosi/mkosi.postinst.chroot \
            packaging/*.sh \
            tests/*.sh

      - name: Validate Python Scripts, SBOM Gate & OS Hardening Audit
        run: |
          python3 -m py_compile \
            branding/scripts/adapt_branding.py \
            ml-stack/generate_synthetic_tabular.py \
            ml-stack/neuro_selftest/pytorch_mlflow.py \
            tests/verify-sbom-licenses.py \
            tests/verify-security-hardening.py
          python3 tests/verify-sbom-licenses.py --self-test
          python3 tests/verify-security-hardening.py

      - name: Validate TOML, JSON & Jupyter Manifests
        run: |
          python3 - <<'PY'
          import json, pathlib, tomllib
          for p in pathlib.Path(".").rglob("*.toml"):
              tomllib.loads(p.read_text(encoding="utf-8"))
          for p in pathlib.Path(".").rglob("*.json"):
              json.loads(p.read_text(encoding="utf-8"))
          for p in pathlib.Path(".").rglob("*.ipynb"):
              json.loads(p.read_text(encoding="utf-8"))
          print("All TOML, JSON, and Jupyter notebook files parsed cleanly.")
          PY
