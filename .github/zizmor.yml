#
# Zizmor GitHub Actions security policy for NeuroCore OS.
# Enforces full 40-character immutable commit SHA pinning (unpinned-uses)
# alongside template-injection, artipacked, excessive-permissions,
# dangerous-triggers, impostor-commit, and cache-poisoning audits.

rules:
  unpinned-uses:
    disable: false
