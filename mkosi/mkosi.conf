[Distribution]
Distribution=debian
Release=trixie
Architecture=x86-64
Repositories=main

[Output]
ImageId=neurocore-os
ImageVersion=0.1.0-alpha
Format=disk
OutputDirectory=../out
ManifestFormat=json

[Content]
Hostname=neurocore
Bootable=yes
Bootloader=grub
ShimBootloader=none
KernelCommandLine=quiet splash lsm=landlock,lockdown,yama,apparmor,bpf lockdown=integrity init_on_alloc=1 init_on_free=1 slab_nomerge page_alloc.shuffle=1 console=tty0 console=ttyS0,115200
ExtraTrees=mkosi.extra
PackageDirectories=mkosi.packages
