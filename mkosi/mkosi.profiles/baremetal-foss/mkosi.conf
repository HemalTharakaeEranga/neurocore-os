# Default baremetal-foss workstation profile: adds redistributable GPU microcode
# firmware (non-free-firmware) and MIT-licensed Intel Compute Runtime (NEO)
# while keeping Modular MAX and proprietary NVIDIA CUDA strictly quarantined.

[Distribution]
Repositories=main,non-free-firmware

[Output]
ImageId=neurocore-os-baremetal-foss

[Content]
Packages=
        firmware-amd-graphics
        firmware-intel-graphics
        firmware-misc-nonfree
        intel-opencl-icd
