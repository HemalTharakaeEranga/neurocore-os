[Content]
# Pure-FOSS Debian 13 "Trixie" ML compiler, Vulkan/OpenCL, and Python foundation.
# System /usr/bin/rustc (1.85) stays dedicated to Linux kernel/module builds;
# user-space ML Rust 1.100.0 is installed separately under /opt/ml/toolchains/rust.
Packages=
        build-essential
        gcc
        g++
        clang-19
        lld-19
        llvm-19
        cmake
        ninja-build
        pkg-config
        python3
        python3-venv
        python3-dev
        mesa-vulkan-drivers
        vulkan-tools
        libvulkan-dev
        glslc
        spirv-headers
        mesa-opencl-icd
        ocl-icd-libopencl1
        clinfo
        libssl-dev
        sqlite3
