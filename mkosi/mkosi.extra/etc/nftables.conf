#
# NeuroCore OS Default-Deny Inbound Host Firewall (nftables)
# Blocks all unsolicited inbound LAN/Wi-Fi traffic. Local AI studio services
# (MLflow :5000, JupyterLab :8888) remain strictly loopback-only (127.0.0.1).

flush ruleset

table inet neurocore_filter {
    chain input {
        type filter hook input priority 0; policy drop;

        # Allow loopback traffic (MLflow, JupyterLab, local IPC)
        iifname "lo" accept

        # Drop spoofed loopback packets arriving on external interfaces
        iifname != "lo" ip daddr 127.0.0.0/8 drop
        iifname != "lo" ip6 daddr ::1 drop

        # Allow replies to host-initiated outbound connections
        ct state established,related accept

        # Drop malformed/invalid packets early
        ct state invalid drop

        # Allow essential ICMPv6 neighbor discovery / PMTU on IPv6 networks
        ip6 nexthdr icmpv6 icmpv6 type { destination-unreachable, packet-too-big, time-exceeded, parameter-problem, nd-neighbor-solicit, nd-neighbor-advert, nd-router-advert } accept

        # Default policy drops all unsolicited inbound connections (rate-limited log)
        limit rate 5/minute burst 10 packets log prefix "neurocore-fw-drop: " flags all counter drop
    }

    chain forward {
        type filter hook forward priority 0; policy drop;
    }

    chain output {
        type filter hook output priority 0; policy accept;
    }
}
