#
# Ensures FHS 3.0 runtime and developer directories have exact least-privilege
# neuro:neuro ownership on boot (works cleanly with rootless mkosi builds).

d /var/lib/neurocore 0750 neuro neuro -
d /var/lib/neurocore/mlflow 0750 neuro neuro -
d /var/lib/neurocore/mlflow/artifacts 0750 neuro neuro -
d /var/lib/neurocore/models 0750 neuro neuro -
d /var/lib/neurocore/cache 0750 neuro neuro -
Z /var/lib/neurocore 0750 neuro neuro -

d /home/neuro 0750 neuro neuro -
d /home/neuro/workspace 0750 neuro neuro -
d /home/neuro/notebooks 0750 neuro neuro -
Z /home/neuro 0750 neuro neuro -
